[package]
name = "boom-executor"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "=4.5.29", features = ["derive"] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_JobObjects",
  "Win32_System_Console",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }
